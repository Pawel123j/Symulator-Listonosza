name: Logic tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run headless logic tests
        run: dotnet run --project tools/LogicTests
